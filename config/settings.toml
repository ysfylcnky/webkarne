# Karne scan settings — operational parameters for collectors.
#
# Declarative config only; no scoring logic here (that lives in scoring.toml).
# Collectors read this file; the hash of the effective settings is stored on each
# scan (scans.config_hash) for reproducibility.

[dns]
# Conservative defaults. Passive measurement only (PLAN.md K-07).
timeout_seconds = 5.0        # per-try timeout for a single DNS query
lifetime_seconds = 10.0      # total time budget per name (dnspython "lifetime")
retries = 2                  # extra attempts on timeout (on top of the first try)
retry_backoff_seconds = 0.5  # base backoff between retries
rate_per_second = 10.0       # polite throughput cap across the whole scan
concurrency = 4              # max parallel DNS queries (e.g. the DKIM selector sweep)
# Fixed, DNSSEC-validating resolvers (PLAN.md K-11): 1.1.1.1 primary, 8.8.8.8
# backup. Chosen over the system resolver so the DNSSEC AD flag is observed
# correctly and the measurement is reproducible. Empty ([]) falls back to the
# system resolver.
resolvers = ["1.1.1.1", "8.8.8.8"]
# SERVFAIL policy (PLAN.md K-11): on SERVFAIL, wait retry_backoff_seconds and
# re-query once (the resolver list holds primary+backup, so both are retried).
# A persisting SERVFAIL is still recorded as "could not measure" (rule 6), flagged
# requeried=true. 0 disables re-querying. Independent of the timeout `retries`.
servfail_requeries = 1

[http]
# Single short GET for the MTA-STS well-known policy; failures are tolerated.
# Redirects are NOT followed (RFC 8461 §3.3); TLS certificates are verified.
timeout_seconds = 5.0
max_bytes = 65536            # cap the policy download size
# Announces the project and its public info page (PLAN.md section 4, K-14).
# Changed from the GitHub URL on 2026-09-17 at go-live; earlier scans differ by
# config_hash.
user_agent = "WebKarne/1.0 (+https://webkarne.com/tr/hakkinda; passive measurement)"

[tls_http]
# Dimension B (Sprint 3). Passive, browser-equivalent: homepage HTTP GET + TLS
# handshakes on 443 only (PLAN.md K-07 and the §4 TLS-version-probing decision).
# No STARTTLS, no port scan, no directory/vuln probing.
timeout_seconds = 7.0        # per TCP/TLS connect + per HTTP request
max_redirects = 10           # http:// enforcement chain hop cap
max_bytes = 65536            # cap any body we read (headers are the point)
rate_per_second = 5.0        # polite throughput cap for this collector
# TLS versions to probe with a separate handshake each (supported? + negotiated
# cipher). A version the local OpenSSL cannot configure is recorded as
# "unprobeable_local" (could not measure), kept distinct from a server refusal.
probe_tls_versions = ["TLSv1", "TLSv1.1", "TLSv1.2", "TLSv1.3"]

[web_privacy]
# Dimension C (Sprint 4, PLAN.md K-06/K-16). A real Chromium visits the homepage only,
# once per consent state, each in a fresh browser context. No link following, no
# forms, no login; in the "untouched" state there is no interaction at all.
# Local-only for now: `karne scan <domain> --collectors privacy` (not batch, not web).
navigation_timeout_seconds = 30.0  # page.goto / page.reload until DOMContentLoaded
observe_seconds = 15.0             # fixed observation window after load / after an action (PLAN §3-C)
state_budget_seconds = 120.0       # cap per state before the action (navigation + load wait + banner wait)
min_interval_seconds = 1.0         # minimum gap between our navigations (§4: <= 1 req/s)
max_requests = 1000                # network requests recorded per state; beyond: truncated flag
max_url_length = 2048              # request URLs longer than this are cut and flagged
# Headed Chromium, window placed off-screen (K-16 addendum): headless was blocked on
# ~30% of a Turkish sample, clustered in e-commerce. The UA is never spoofed.
headless = false
browser_args = [
    "--window-position=-32000,-32000",
    # An off-screen window must not be throttled like a background tab.
    "--disable-backgrounding-occluded-windows",
    "--disable-renderer-backgrounding",
    "--disable-background-timer-throttling",
]
locale = "tr-TR"
timezone = "Europe/Istanbul"
viewport_width = 1366
viewport_height = 768
# The browser's own User-Agent with the [http].user_agent identity appended (K-16).
append_identity_to_user_agent = true

[web_privacy.block_markers]
# Observable bot-protection signals (outcome "blocked", rule 6). A measurement-state
# classifier, not a judgement: "blocked" is recorded only when one of these is SEEN,
# and the matched markers are stored as evidence. Header names are lower-case.
headers = { "cf-mitigated" = "challenge" }
# A challenge title counts only together with one of these main-document statuses.
statuses = [403, 429, 503]
titles = [
    "Just a moment...",
    "Attention Required! | Cloudflare",
    "Access Denied",
    "Pardon Our Interruption",
    "Access to this page has been denied",
    "Bir dakika lütfen...",
]
# Block pages served with ANY status (isbank.com.tr answers 200; its title is also
# observed mis-decoded, so both spellings are listed).
titles_any_status = ["İstek Engellendi", "Ä°stek Engellendi"]

[web_privacy.consent]
# Consent-UI observation and the "rejected" state (PLAN.md K-06, K-16 addendum).
# Only the banner's own first-layer reject control is ever clicked, once, and only if
# visible. These rules FIND things; they judge nothing (the matched rule id is stored).
banner_wait_seconds = 15.0     # max wait for a banner / visible reject control after load
poll_interval_seconds = 1.0
click_timeout_seconds = 5.0
banner_text_max_chars = 2000
max_label_chars = 80           # longer "controls" are prose, never classified
max_generic_candidates = 10
max_frames_scanned = 30        # iframes included (CMP notices often live in one)
# A non-CMP banner is a visible fixed/sticky/dialog element whose text holds one of these
# (compared Turkish-aware lower-case).
banner_keywords = ["çerez", "cerez", "cookie", "kvkk", "kişisel veri", "tanımlama bilgi"]

# Label rules, tried in order; the first match gives the role. Patterns are Python
# regexes searched in the normalised label (Turkish-aware lower-case, whitespace
# collapsed). Reject rules come first ("kabul etmiyorum" contains "kabul").
[[web_privacy.consent.label_rules]]
id = "reject"
role = "reject"
pattern = '\b(reddet|reject|decline|deny)\b|kabul etmiyorum'
[[web_privacy.consent.label_rules]]
id = "necessary_only"
role = "reject"
pattern = '\b(yaln[ıi]zca|sadece) (zorunlu|gerekli)\b|\b(only|strictly) (necessary|essential)\b|\bnecessary only\b'
[[web_privacy.consent.label_rules]]
id = "settings"
role = "settings"
pattern = '\b(ayar\w*|tercih\w*|yönet\w*|özelleştir\w*|settings|preferences|customi[sz]e|manage)\b'
[[web_privacy.consent.label_rules]]
id = "accept"
role = "accept"
pattern = '\b(kabul|izin ver|onayla|accept|allow|agree)\b'

# CMP signatures and vendor selectors (from vendor markup; verified on live sites where
# noted). Selectors are matched through open shadow roots. A vendor selector role beats
# a label rule; unmatched controls still fall back to label rules.
[[web_privacy.consent.cmps]]
id = "onetrust"           # verified: vodafone.com.tr, trendyol.com, toyota.com.tr
globals = ["OneTrust", "OptanonWrapper"]
script_hosts = ["cdn.cookielaw.org", "optanon.blob.core.windows.net"]
banner_selectors = ["#onetrust-banner-sdk"]
reject_selectors = ["#onetrust-reject-all-handler"]
accept_selectors = ["#onetrust-accept-btn-handler"]
settings_selectors = ["#onetrust-pc-btn-handler"]
[[web_privacy.consent.cmps]]
id = "cookiebot"          # verified: dr.com.tr
globals = ["Cookiebot"]
script_hosts = ["consent.cookiebot.com", "consentcdn.cookiebot.com"]
banner_selectors = ["#CybotCookiebotDialog"]
reject_selectors = ["#CybotCookiebotDialogBodyButtonDecline"]
accept_selectors = ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll", "#CybotCookiebotDialogBodyButtonAccept"]
settings_selectors = ["#CybotCookiebotDialogBodyLevelButtonCustomize"]
[[web_privacy.consent.cmps]]
id = "didomi"             # verified: decathlon.com.tr
globals = ["Didomi"]
script_hosts = ["sdk.privacy-center.org"]
banner_selectors = ["#didomi-notice", "#didomi-popup"]
reject_selectors = ["#didomi-notice-disagree-button"]
accept_selectors = ["#didomi-notice-agree-button"]
settings_selectors = ["#didomi-notice-learn-more-button"]
[[web_privacy.consent.cmps]]
id = "efilli"             # Turkish CMP, shadow DOM, UUID ids -> label rules; verified: akbank.com
globals = ["efilliSdk"]
script_hosts = ["bundles.efilli.com"]
banner_selectors = ["efilli-layout-dynamic"]
reject_selectors = []
accept_selectors = []
settings_selectors = []
[[web_privacy.consent.cmps]]
id = "usercentrics"
globals = ["UC_UI"]
script_hosts = ["app.usercentrics.eu", "web.cmp.usercentrics.eu"]
banner_selectors = ["#usercentrics-root", "#usercentrics-cmp-ui"]
reject_selectors = ["[data-testid='uc-deny-all-button']"]
accept_selectors = ["[data-testid='uc-accept-all-button']"]
settings_selectors = ["[data-testid='uc-more-button']"]
[[web_privacy.consent.cmps]]
id = "cookieyes"
globals = []
script_hosts = ["cdn-cookieyes.com"]
banner_selectors = [".cky-consent-container"]
reject_selectors = [".cky-btn-reject"]
accept_selectors = [".cky-btn-accept"]
settings_selectors = [".cky-btn-customize"]
[[web_privacy.consent.cmps]]
id = "complianz"
globals = []
script_hosts = []
banner_selectors = [".cmplz-cookiebanner"]
reject_selectors = [".cmplz-deny"]
accept_selectors = [".cmplz-accept"]
settings_selectors = [".cmplz-view-preferences"]
[[web_privacy.consent.cmps]]
id = "iubenda"
globals = ["_iub"]
script_hosts = ["cdn.iubenda.com"]
banner_selectors = ["#iubenda-cs-banner"]
reject_selectors = [".iubenda-cs-reject-btn"]
accept_selectors = [".iubenda-cs-accept-btn"]
settings_selectors = [".iubenda-cs-customize-btn"]

[web]
# Abuse guard for the public "scan any domain" endpoint (PLAN.md K-14). Limits are
# held in process memory, so the server runs ONE uvicorn worker. No IP is recorded.
rescan_cooldown_seconds = 600  # an ad-hoc scan this recent is shown instead of rescanning
max_concurrent_scans = 4       # live scans running at once; beyond this the query is refused

[dkim]
# DKIM selectors CANNOT be discovered from DNS; they are guessed. This is a
# documented method limitation — the collector marks DKIM output with
# method = "selector_guessing" and it is reported as such in the thesis.
selectors = [
    "selector1", "selector2", "google", "default", "dkim", "mail",
    "k1", "k2", "s1", "s2", "zoho", "mandrill", "smtp", "email",
    "mailjet", "sendgrid",
]

[mx_providers]
# MX host-suffix -> provider label. Longest matching suffix wins. A host inside
# the scanned domain is labelled "local"; anything unmatched is labelled "other".
# This is a factual categorisation (who hosts the mail), not a quality judgement.
"google.com" = "google"
"googlemail.com" = "google"
"outlook.com" = "microsoft"
"office365.com" = "microsoft"
"yandex.net" = "yandex"
"yandex.ru" = "yandex"
"yandex.com.tr" = "yandex"
"zoho.com" = "zoho"
"zoho.eu" = "zoho"
"pphosted.com" = "proofpoint"
"mimecast.com" = "mimecast"
"antispamcloud.com" = "spamexperts"
"yaani.com" = "yaani"
