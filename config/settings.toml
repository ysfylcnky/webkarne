# Karne scan settings — operational parameters for collectors.
#
# Declarative config only; no scoring logic here (that lives in scoring.toml).
# Collectors read this file; the hash of the effective settings is stored on each
# scan (scans.config_hash) for reproducibility.

[dns]
# Conservative defaults. Passive measurement only (PLAN.md K-07).
timeout_seconds = 5.0        # per-try timeout for a single DNS query
lifetime_seconds = 10.0      # total time budget per name (dnspython "lifetime")
retries = 2                  # extra attempts on timeout (on top of the first try)
retry_backoff_seconds = 0.5  # base backoff between retries
rate_per_second = 10.0       # polite throughput cap across the whole scan
concurrency = 4              # max parallel DNS queries (e.g. the DKIM selector sweep)
# Fixed, DNSSEC-validating resolvers (PLAN.md K-11): 1.1.1.1 primary, 8.8.8.8
# backup. Chosen over the system resolver so the DNSSEC AD flag is observed
# correctly and the measurement is reproducible. Empty ([]) falls back to the
# system resolver.
resolvers = ["1.1.1.1", "8.8.8.8"]
# SERVFAIL policy (PLAN.md K-11): on SERVFAIL, wait retry_backoff_seconds and
# re-query once (the resolver list holds primary+backup, so both are retried).
# A persisting SERVFAIL is still recorded as "could not measure" (rule 6), flagged
# requeried=true. 0 disables re-querying. Independent of the timeout `retries`.
servfail_requeries = 1

[http]
# Single short GET for the MTA-STS well-known policy; failures are tolerated.
# Redirects are NOT followed (RFC 8461 §3.3); TLS certificates are verified.
timeout_seconds = 5.0
max_bytes = 65536            # cap the policy download size
# Announces the project and its public info page (PLAN.md section 4, K-14).
# Changed from the GitHub URL on 2026-09-17 at go-live; earlier scans differ by
# config_hash.
user_agent = "WebKarne/1.0 (+https://webkarne.com/tr/hakkinda; passive measurement)"

[tls_http]
# Dimension B (Sprint 3). Passive, browser-equivalent: homepage HTTP GET + TLS
# handshakes on 443 only (PLAN.md K-07 and the §4 TLS-version-probing decision).
# No STARTTLS, no port scan, no directory/vuln probing.
timeout_seconds = 7.0        # per TCP/TLS connect + per HTTP request
max_redirects = 10           # http:// enforcement chain hop cap
max_bytes = 65536            # cap any body we read (headers are the point)
rate_per_second = 5.0        # polite throughput cap for this collector
# TLS versions to probe with a separate handshake each (supported? + negotiated
# cipher). A version the local OpenSSL cannot configure is recorded as
# "unprobeable_local" (could not measure), kept distinct from a server refusal.
probe_tls_versions = ["TLSv1", "TLSv1.1", "TLSv1.2", "TLSv1.3"]

[web]
# Abuse guard for the public "scan any domain" endpoint (PLAN.md K-14). Limits are
# held in process memory, so the server runs ONE uvicorn worker. No IP is recorded.
rescan_cooldown_seconds = 600  # an ad-hoc scan this recent is shown instead of rescanning
max_concurrent_scans = 4       # live scans running at once; beyond this the query is refused

[dkim]
# DKIM selectors CANNOT be discovered from DNS; they are guessed. This is a
# documented method limitation — the collector marks DKIM output with
# method = "selector_guessing" and it is reported as such in the thesis.
selectors = [
    "selector1", "selector2", "google", "default", "dkim", "mail",
    "k1", "k2", "s1", "s2", "zoho", "mandrill", "smtp", "email",
    "mailjet", "sendgrid",
]

[mx_providers]
# MX host-suffix -> provider label. Longest matching suffix wins. A host inside
# the scanned domain is labelled "local"; anything unmatched is labelled "other".
# This is a factual categorisation (who hosts the mail), not a quality judgement.
"google.com" = "google"
"googlemail.com" = "google"
"outlook.com" = "microsoft"
"office365.com" = "microsoft"
"yandex.net" = "yandex"
"yandex.ru" = "yandex"
"yandex.com.tr" = "yandex"
"zoho.com" = "zoho"
"zoho.eu" = "zoho"
"pphosted.com" = "proofpoint"
"mimecast.com" = "mimecast"
"antispamcloud.com" = "spamexperts"
"yaani.com" = "yaani"
